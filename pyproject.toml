[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftt"
version = "0.1.0"
description = "BERT Transformer fine tuning by 640k tweets"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "dotenv",
]

[dependency-groups]
preprocessing = [
    "duckdb",
    "lingua-language-detector",
]

baseline = [
    "scikit-learn",
    "optuna",
]

dev = [
    "ipykernel",
]

training = [
    "transformers",
    "evaluate",
]


[tool.setuptools.packages.find]
where = ["src"]